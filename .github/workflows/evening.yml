name: evening
on:
  schedule:
    # one job per window; each loops internally until the window ends, so a late start still covers the rest.
    # GitHub launches scheduled jobs ~4h late on this repo, so these are 4h earlier than the window we want.
    # 16:00Z = noon EDT; the loop idles until a game is within 3h. Backups at 18:00Z / 20:00Z queue behind a running loop.
    # The primary kick is a Claude scheduled task that dispatches this workflow at ~2:40pm ET; these crons are backups.
    - cron: "0 16 * * *"
    - cron: "0 18 * * *"
    - cron: "0 20 * * *"
  workflow_dispatch:
    inputs:
      once:
        description: "Run a single pull instead of looping (true/false)"
        required: false
        default: "false"
concurrency:
  group: nhl-evening
  cancel-in-progress: false
permissions:
  contents: write
  issues: write
jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Pull every 15 min until 11:45pm ET
        env:
          PYTHONPATH: src
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALERT_MENTION: "@jjurgill14"
        run: |
          git config user.name "nhl-props-bot"
          git config user.email "bot@users.noreply.github.com"
          END=$(TZ=America/New_York date -d "today 23:45" +%s)
          NOW=$(date +%s)
          HOUR_ET=$(TZ=America/New_York date +%H)
          if [ "${{ github.event.inputs.once }}" != "true" ]; then
            if [ "$NOW" -gt "$END" ]; then echo "past window end"; exit 0; fi
            # a late cron run that was queued behind tonight's loop starts after midnight ET;
            # "today 23:45" is then tomorrow, so bail instead of looping all night.
            if [ "$HOUR_ET" -lt 10 ]; then echo "started after midnight ET; nothing to do"; exit 0; fi
          fi
          while true; do
            python -m nhl_props.run evening || echo "evening pull failed (continuing)"
            git add -A data docs
            if ! git diff --cached --quiet; then
              git commit -m "evening: $(date -u +%Y-%m-%dT%H:%MZ)"
              git pull --rebase -X theirs || { git rebase --abort || true; git reset --hard origin/main; }
              git push || (git pull --rebase -X theirs && git push)
            fi
            if [ "${{ github.event.inputs.once }}" = "true" ]; then exit 0; fi
            NOW=$(date +%s)
            if [ "$NOW" -gt "$END" ]; then echo "window closed"; exit 0; fi
            # evening job writes the cadence: 300s when any game is inside the final hour, else 900s
            sleep "$(cat data/next_sleep 2>/dev/null || echo 900)"
          done
