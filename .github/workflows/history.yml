name: history
# One-off pulls of prior seasons' skater game logs for studies (data/history/). Not part of the daily pipeline.
on:
  workflow_dispatch:
    inputs:
      seasons:
        description: "Season ids, space separated (e.g. 20252026 20242025)"
        required: true
        default: "20252026"
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: pull
        env:
          PYTHONPATH: src
        run: python tools/history_pull.py ${{ github.event.inputs.seasons }}
      - name: Commit data
        run: |
          git config user.name "nhl-props-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/history
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "history: ${{ github.event.inputs.seasons }}"
          for i in 1 2 3 4 5; do git pull --rebase && git push && break || sleep 20; done
