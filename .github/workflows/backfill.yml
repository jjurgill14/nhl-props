name: backfill
on:
  workflow_dispatch:
    inputs:
      days:
        description: "How many days back to pull boxscores/shifts for"
        required: false
        default: "7"
      force:
        description: "Re-pull games that already have files (true/false)"
        required: false
        default: "false"
concurrency:
  group: nhl-data
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: backfill
        env:
          PYTHONPATH: src
        run: |
          FORCE=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then FORCE="--force"; fi
          python -m nhl_props.run backfill --days "${{ github.event.inputs.days }}" $FORCE
      - name: Commit data
        run: |
          git config user.name "nhl-props-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "backfill: $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push
